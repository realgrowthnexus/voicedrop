name: worker-image

# Builds the RunPod TTS worker image and pushes it to GitHub Container Registry (GHCR).
on:
  push:
    branches: [main, "claude/**"]
    paths: ["worker/**", ".github/workflows/worker-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voiceoverdrop-worker" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test on CPU (the pipeline must synthesize inside the image)
        run: |
          docker run -e VD_ALLOW_HTTP_UPLOADS=1 "${{ steps.img.outputs.name }}:${{ github.sha }}" \
            python -c "from vd_worker.handler import get_engine; from vd_worker.pipeline import synthesize; r = synthesize(get_engine(), 'Hello from the build check.', 'af_heart'); assert r.duration > 1; print('ok', round(r.duration, 2), get_engine().providers)"
      - name: Push
        run: |
          IMG="${{ steps.img.outputs.name }}"
          TAG="${{ github.ref_name == 'main' && 'latest' || 'dev' }}"
          docker tag "$IMG:${{ github.sha }}" "$IMG:$TAG"
          docker push "$IMG:${{ github.sha }}"
          docker push "$IMG:$TAG"
